# Fabric properties (https://fabricmc.net/develop) -- version roadmap: 1.21.4 -> 1.21.11 ->
# 1.21.5 -> 1.21.8 -> 1.21.10 -> 1.21.11 (here, again -- the loop this mod's own version-hop
# history called out as the eventual destination). Bumped for the local-hazard-alert/addon-API/
