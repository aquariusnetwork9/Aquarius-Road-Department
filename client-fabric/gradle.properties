# Fabric properties (https://fabricmc.net/develop) -- this branch is a release-only port: same
# local-hazard-alert/addon-API/Baritone-auto-avoid featureset as the mod's current (main, 1.21.11)
# target, rebuilt against 1.21.4, the oldest version this mod has ever shipped. Two source
# changes needed here (unlike the 1.21.8/1.21.10 ports): HighwayConditionsFabricClient's HUD
# registration (HudRenderCallback is the only option this far back) and
# HighwayConditionsCommand's ClickEvent construction (the old (Action, String) constructor,
# predates the ~1.21.5 sealed-interface rewrite). Not meant to be merged to main; exists only so
# GitHub Actions has something to build+publish this exact version from.
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.19.3
fabric_version=0.119.4+1.21.4

# Mod properties
mod_version=0.2.0
maven_group=com.aquariusnetwork.highwayconditions
archives_base_name=ard

org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
